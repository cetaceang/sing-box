name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y jq shellcheck
      - name: Bash syntax and ShellCheck
        run: |
          for file in install.sh sing-box.sh src/*.sh; do bash -n "$file"; done
          shellcheck --extended-analysis=false -s bash -S error install.sh sing-box.sh src/{init,core,download,help,manager,dns,log}.sh
          shellcheck -s bash -S warning -e SC2154 src/manager.sh
      - name: Isolated management regression tests
        run: python3 -m unittest discover -s tests -v
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and package scripts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^is_sh_ver=//p' sing-box.sh)
          test "$version" = "$RELEASE_TAG"
          tar -czf code.tar.gz install.sh sing-box.sh src LICENSE README.md
          sha256sum code.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            code.tar.gz
            SHA256SUMS
